<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未来世界 - AI 面试进行中</title>
    <style>
        :root {
            --ink: #15172b;
            --muted: #7b8498;
            --panel: #ffffff;
            --line: #e4e8f2;
            --violet: #7c5cff;
            --violet-2: #6964ff;
            --green: #18bd72;
            --danger: #ef466f;
            --warning: #ff9b54;
            --shadow: 0 24px 70px rgba(22, 18, 62, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            color: var(--ink);
            background:
                radial-gradient(circle at 50% 0%, rgba(132, 101, 255, 0.35), transparent 34%),
                linear-gradient(135deg, #171451 0%, #151341 48%, #10101f 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
        }

        .site-header {
            height: 64px;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid rgba(228, 232, 242, 0.74);
        }

        .header-inner {
            width: min(1120px, calc(100% - 48px));
            height: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 19px;
            font-weight: 900;
        }

        .brand img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            border-radius: 4px;
        }

        .header-note {
            color: #667087;
            font-size: 13px;
            font-weight: 800;
        }

        .page {
            min-height: calc(100vh - 64px);
            padding: 42px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: min(980px, 100%);
        }

        .hero-copy {
            color: #fff;
            text-align: center;
            margin-bottom: 26px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 0 14px;
            border-radius: 999px;
            color: #d2ccff;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.16);
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 14px;
        }

        .hero-copy h1 {
            font-size: 34px;
            line-height: 1.2;
            letter-spacing: 0;
            margin-bottom: 10px;
        }

        .hero-copy p {
            color: rgba(232, 231, 255, 0.72);
            font-size: 15px;
            font-weight: 600;
        }

        .interview-card {
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.76);
            border-radius: 22px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .status-bar {
            min-height: 70px;
            padding: 18px 26px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            color: #fff;
            background: linear-gradient(135deg, #7c5cff, #6964ff);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 900;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #28e586;
            border-radius: 50%;
            box-shadow: 0 0 0 6px rgba(40, 229, 134, 0.18);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        #roundInfo {
            min-height: 34px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
            font-size: 13px;
            font-weight: 900;
        }

        .question-section,
        .recording-section {
            width: min(760px, calc(100% - 48px));
            margin: 0 auto;
        }

        .question-section {
            padding: 36px 0 30px;
            border-bottom: 1px solid var(--line);
        }

        .question-number {
            display: inline-flex;
            min-height: 32px;
            padding: 0 12px;
            align-items: center;
            border-radius: 999px;
            color: var(--violet);
            background: #f0edff;
            font-size: 13px;
            font-weight: 900;
            margin-bottom: 18px;
        }

        .question-text {
            min-height: 96px;
            max-height: 280px;
            overflow-y: auto;
            color: #202337;
            font-size: 22px;
            line-height: 1.72;
            font-weight: 800;
            margin-bottom: 24px;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .audio-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-audio,
        .btn-start-recording,
        .btn-stop-recording,
        .btn-submit-answer {
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 900;
            transition: transform 0.22s ease, box-shadow 0.22s ease, opacity 0.22s ease;
        }

        .btn-audio {
            min-height: 42px;
            padding: 0 20px;
            color: #fff;
            background: linear-gradient(135deg, #8b67ff, #6d65ff);
            box-shadow: 0 12px 28px rgba(124, 92, 255, 0.26);
        }

        .btn-audio:hover:not(:disabled),
        .btn-start-recording:hover,
        .btn-stop-recording:hover,
        .btn-submit-answer:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .btn-audio:disabled,
        .btn-submit-answer:disabled {
            opacity: 0.62;
            cursor: not-allowed;
        }

        .recording-section {
            padding: 30px 0 36px;
        }

        .asr-status {
            min-height: 36px;
            padding: 0 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #65708a;
            background: #f6f8fc;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .answer-input {
            width: 100%;
            min-height: 170px;
            padding: 18px;
            border: 1px solid #d8deeb;
            border-radius: 16px;
            color: var(--ink);
            background: #fbfcff;
            font: inherit;
            font-size: 15px;
            line-height: 1.8;
            resize: vertical;
            transition: border-color 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
        }

        .answer-input:focus {
            outline: none;
            border-color: var(--violet);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.12);
        }

        .btn-row {
            margin-top: 16px;
        }

        .btn-start-recording,
        .btn-stop-recording {
            min-height: 46px;
            padding: 0 26px;
            color: #fff;
        }

        .btn-start-recording {
            background: linear-gradient(135deg, #18bd72, #0f9c60);
            box-shadow: 0 12px 28px rgba(24, 189, 114, 0.26);
        }

        .btn-stop-recording {
            background: linear-gradient(135deg, #ef466f, #d9365f);
            box-shadow: 0 12px 28px rgba(239, 70, 111, 0.24);
        }

        .btn-submit-answer {
            width: 100%;
            min-height: 50px;
            margin-top: 20px;
            color: #fff;
            background: linear-gradient(135deg, #8b67ff, #6d65ff);
            box-shadow: 0 14px 34px rgba(124, 92, 255, 0.28);
            font-size: 15px;
        }

        .recording-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #c9d1df;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .recording-indicator.active {
            background: #ef466f;
            box-shadow: 0 0 0 6px rgba(239, 70, 111, 0.14), 0 0 14px rgba(239, 70, 111, 0.5);
            animation: blink 1s ease-in-out infinite;
        }

        .voice-orb {
            width: min(620px, 100%);
            min-height: 150px;
            margin: 0 auto 18px;
            border: 0;
            border-radius: 0;
            background: transparent;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: transform 0.22s ease, filter 0.22s ease;
        }

        .voice-orb:hover {
            transform: none;
        }

        .voice-wave {
            position: relative;
            width: min(680px, calc(100vw - 48px));
            height: 142px;
            --level: 0;
            overflow: hidden;
        }

        .voice-wave span {
            position: absolute;
            z-index: 1;
            left: calc(var(--x, 0.5) * 100%);
            top: calc(50% + (var(--wave-y, 0) * 1px) + (var(--scatter-y, 0) * 1px));
            width: calc(var(--size, 3) * 1px + var(--level) * 2px);
            height: calc(var(--size, 3) * 1px + var(--level) * 2px);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff1c7 0 10%, hsl(var(--hue, 22) 88% 58%) 54%, hsl(var(--hue, 22) 92% 42%) 100%);
            box-shadow: 0 0 calc(3px + var(--level) * 12px) hsla(var(--hue, 22) 90% 56% / 0.62);
            opacity: calc(var(--opacity, 0.62) + var(--level) * 0.26);
            transform: translate(-50%, -50%) translateY(calc(var(--level) * var(--amp, 0.4) * -16px));
            transform-origin: center;
            transition: width 0.08s linear, height 0.08s linear, opacity 0.08s linear, transform 0.08s linear, filter 0.08s linear;
        }

        .voice-wave::before,
        .voice-wave::after {
            content: "";
            position: absolute;
            inset: 18px 8px;
            border-radius: 999px;
            background: radial-gradient(ellipse at center, rgba(255, 126, 55, 0.18), rgba(124, 92, 255, 0.08) 48%, transparent 72%);
            filter: blur(10px);
            opacity: 0.78;
        }

        .voice-wave::after {
            inset: auto 12px 50%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 126, 55, 0.45), rgba(124, 92, 255, 0.38), transparent);
            filter: blur(0);
            opacity: calc(0.12 + var(--level) * 0.32);
        }

        .voice-wave.active span {
            opacity: 1;
            filter: brightness(1.18);
            animation: voiceParticle 1.1s ease-in-out infinite;
        }

        @keyframes voiceParticle {
            0%, 100% { translate: 0 0; }
            50% { translate: 0 calc(var(--drift, 0) * -10px); }
        }

        .particle-container {
            position: relative;
            width: 340px;
            height: 340px;
            margin: 0 auto;
            background: transparent;
            border-radius: 50%;
            overflow: visible;
            isolation: isolate;
        }

        .logo-pattern {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .logo-diamond {
            display: none;
        }

        .inner-particle {
            position: absolute;
            width: var(--particle-size, 2px);
            height: var(--particle-size, 2px);
            background: radial-gradient(circle at 35% 35%, var(--particle-color, #c9a8ff), rgba(124, 92, 255, 0.6));
            border-radius: 50%;
            pointer-events: none;
            opacity: var(--particle-opacity, 0.85);
            transform: translate3d(var(--x, 0px), var(--y, 0px), 0);
            will-change: transform, opacity;
            contain: layout style paint;
            mix-blend-mode: normal;
            box-shadow: 
                0 0 calc(var(--glow-size, 6px)) var(--particle-color, #c9a8ff),
                0 0 calc(var(--glow-size, 6px) * 2) rgba(124, 92, 255, 0.4);
        }

        .transcript-panel {
            min-height: 96px;
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #fbfcff;
            color: #2f364d;
            font-size: 15px;
            line-height: 1.8;
        }

        .answer-input {
            display: none;
        }

        .btn-row,
        .btn-submit-answer {
            display: none !important;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        .toast {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 1000;
            max-width: min(360px, calc(100vw - 40px));
            padding: 14px 20px;
            border-radius: 12px;
            color: white;
            font-weight: 800;
            box-shadow: 0 16px 40px rgba(20, 18, 48, 0.2);
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            background: linear-gradient(135deg, #16b66d, #2ddc7d);
        }

        .toast.error {
            background: linear-gradient(135deg, #ef466f, #ce2f59);
        }

        .toast.warning {
            background: linear-gradient(135deg, #ff9b54, #f59e0b);
        }

        .loading-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        .completion-shell {
            min-height: calc(100vh - 64px);
            padding: 24px;
            display: grid;
            place-items: center;
        }

        .completion-card {
            width: min(520px, 100%);
            padding: 46px;
            text-align: center;
            background: #fff;
            border-radius: 22px;
            box-shadow: var(--shadow);
        }

        .completion-mark {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            color: #fff;
            background: linear-gradient(135deg, #18bd72, #2ddc7d);
            font-size: 34px;
            font-weight: 900;
        }

        .completion-card h2 {
            font-size: 28px;
            margin-bottom: 14px;
        }

        .completion-card p {
            color: var(--muted);
            line-height: 1.8;
            margin-bottom: 26px;
            font-weight: 600;
        }

        .completion-card button {
            min-height: 46px;
            padding: 0 34px;
            color: #fff;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, #8b67ff, #6d65ff);
            font: inherit;
            font-weight: 900;
            cursor: pointer;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 720px) {
            .site-header {
                height: 58px;
            }

            .header-inner {
                width: calc(100% - 32px);
            }

            .brand {
                font-size: 16px;
            }

            .header-note {
                display: none;
            }

            .page {
                min-height: calc(100vh - 58px);
                padding: 28px 16px;
            }

            .hero-copy h1 {
                font-size: 28px;
            }

            .status-bar {
                align-items: flex-start;
                flex-direction: column;
            }

            .question-section,
            .recording-section {
                width: calc(100% - 32px);
            }

            .question-text {
                font-size: 19px;
            }

            .btn-audio,
            .btn-start-recording,
            .btn-stop-recording {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <div class="brand">
                <img src="/api/ai-interview/hr/send-email/images/email-logo.jpg" alt="未来世界 Logo" onerror="this.style.display='none'">
                <span>未来世界</span>
            </div>
            <div class="header-note">AI 智能面试进行中</div>
        </div>
    </header>

    <main class="page">
        <div class="container">
            <div class="hero-copy">
                <div class="eyebrow">请认真完成每一道题</div>
                <h1>AI 智能面试</h1>
                <p>问题将自动播报，您可以语音作答或手动输入。</p>
            </div>

            <section class="interview-card">
                <div class="status-bar">
                    <div class="status-indicator">
                        <div class="status-dot"></div>
                        <span>面试进行中</span>
                    </div>
                    <div id="roundInfo">准备中</div>
                </div>

                <div class="question-section">
                    <div class="question-number" id="questionNumber">问题</div>
                    <div class="question-text" id="questionText">正在获取问题...</div>

                    <div class="audio-controls">
                        <button class="btn-audio" id="playAudioBtn">
                            播放问题
                        </button>
                        <button class="btn-audio" id="replayAudioBtn">
                            重新播放
                        </button>
                    </div>
                </div>

                <div class="recording-section">
                    <div class="voice-orb" id="voiceOrb" role="button" tabindex="0" aria-label="点击开启实时语音回答">
                        <div class="particle-container" id="particleContainer">
                            <div class="logo-pattern" id="logoPattern">
                                <div class="logo-diamond" id="diamond1"></div>
                                <div class="logo-diamond" id="diamond2"></div>
                                <div class="logo-diamond" id="diamond3"></div>
                                <div class="logo-diamond" id="diamond4"></div>
                                <div class="logo-diamond" id="diamond5"></div>
                                <div class="logo-diamond" id="diamond6"></div>
                            </div>
                        </div>
                    </div>
                    <div class="transcript-panel" id="transcriptPanel">点击语音波浪开启麦克风，听到问题后直接回答。</div>
                    <div class="asr-status" id="asrStatus"><span class="recording-indicator"></span>准备就绪</div>

                    <textarea class="answer-input" id="answerInput" placeholder="您的回答将在这里显示，也可以手动输入..."></textarea>

                    <div class="btn-row" id="btnRow">
                        <button class="btn-start-recording" id="startRecordingBtn">
                            开始回答
                        </button>
                    </div>

                    <button class="btn-submit-answer" id="submitAnswerBtn">
                        提交回答
                    </button>
                </div>
            </section>
        </div>
    </main>

    <script>
        let sessionId = '';
        let candidateId = '';
        let configId = '';
        let currentQuestion = '';
        let roundNumber = 1;
        let maxRounds = 6;
        let roundDisplayName = '';
        let roundObjective = '';
        let currentInterviewType = 'initial_interview';
        let currentInterviewTypeLabel = '面试';
        let interviewCompleted = false;
        let lockReleased = false;
        let localProgressKey = '';
        let localCache = null;
        let interviewDialogueHistory = [];

        let isRecording = false;
        let isInterviewPaused = false;

        let isRealtimeRecognitionActive = false;
        let realtimeSocket = null;
        let realtimeReady = false;
        let realtimeConnectPromise = null;
        let realtimeKeepaliveTimer = null;
        let realtimeClosedNoticeShown = false;
        let audioContext = null;
        let micStream = null;
        let micSource = null;
        let micAnalyser = null;
        let micTimeData = null;
        let micFreqData = null;
        let micAudioReader = null;
        let micAudioPumpActive = false;
        let micAudioFrameBuffer = null;
        let realtimeOutputTime = 0;
        let activeAudioSources = new Set();
        let realtimeAudioMuted = false;
        let receivedRealtimeAudio = false;
        let audioQueue = [];
        let isPlayingFromQueue = false;
        let audioUnlocked = false;
        let realtimePlayFallbackTimer = null;
        let questionSpeechFallbackTimer = null;
        let answerCompletionTimer = null;
        let currentAnswerTranscript = '';
        let isAutoSubmitting = false;
        let hasMicStarted = false;
        let lastAssistantTranscript = '';
        let isCandidateSpeaking = false;
        let isAssistantSpeaking = false;
        let lastSubmittedQuestion = '';
        let lastSubmittedAnswer = '';
        let candidateSpeechWatchFrame = null;
        let localSpeechStartAt = 0;
        let lastInterruptSentAt = 0;
        let voiceWaveLevel = 0;
        let voiceWaveFrame = null;
        const REALTIME_INPUT_SAMPLE_RATE = 16000;
        const REALTIME_OUTPUT_SAMPLE_RATE = 24000;
        const REALTIME_AUDIO_SCHEDULE_LEAD_TIME = 0.08;
        const LOCAL_BARGE_IN_LEVEL = 0.06;
        const LOCAL_BARGE_IN_HOLD_MS = 80;
        const INTERRUPT_THROTTLE_MS = 300;
        const ANSWER_COMPLETION_PAUSE_MS = 1200;
        const VISUALIZER_FFT_SIZE = 128;
        const VISUALIZER_SENSITIVITY = 2.2;
        const VOICE_WAVE_PARTICLE_COUNT = 340;

        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            sessionId = urlParams.get('session_id');
            candidateId = urlParams.get('candidate_id');
            configId = urlParams.get('config_id') || '';
            currentQuestion = urlParams.get('question') || '';
            localProgressKey = `ai_interview_progress:${sessionId}`;

            if (!sessionId) {
                showToast('面试会话无效', 'error');
                return;
            }

            localCache = getLocalSessionCache();
            if (localCache) {
                console.log('[LocalCache] 从本地缓存恢复会话:', localCache);
                if (localCache.currentQuestion) {
                    currentQuestion = localCache.currentQuestion;
                }
                if (localCache.currentRound) {
                    roundNumber = localCache.currentRound;
                }
                if (localCache.maxRounds) {
                    maxRounds = localCache.maxRounds;
                }
                if (localCache.dialogueHistory) {
                    interviewDialogueHistory = localCache.dialogueHistory;
                }
                updateInterviewState({
                    question: currentQuestion,
                    round: roundNumber,
                    total_rounds: maxRounds
                });
                showToast('从本地缓存恢复会话成功', 'success');
            } else {
                updateInterviewState({ question: currentQuestion });
            }

            restoreLocalSnapshotBeforeServer();

            document.getElementById('playAudioBtn').addEventListener('click', function() {
                if (hasMicStarted) {
                    playQuestionAudio(currentQuestion);
                } else {
                    activateVoiceInterview();
                }
            });

            document.getElementById('replayAudioBtn').addEventListener('click', function() {
                if (hasMicStarted) {
                    playQuestionAudio(currentQuestion);
                } else {
                    activateVoiceInterview();
                }
            });

            document.getElementById('startRecordingBtn').addEventListener('click', function() {
                activateVoiceInterview();
            });

            document.getElementById('submitAnswerBtn').addEventListener('click', function() {
                submitAnswer();
            });

            const voiceOrb = document.getElementById('voiceOrb');
            voiceOrb.addEventListener('click', toggleRecording);
            voiceOrb.addEventListener('keydown', function(event) {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    toggleRecording();
                }
            });

            document.getElementById('answerInput').addEventListener('input', function() {
                saveLocalProgress();
                resetInactivityTimer();
            });
            initVoiceWaveParticles();

            initAudioContextSilently();
            installAudioUnlockHandlers();
            installFrontendErrorReporter();

            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                console.log('语音功能可用');
            } else {
                showToast('浏览器不支持语音功能', 'warning');
            }

            window.addEventListener('pagehide', saveAndReleaseLock);
            window.addEventListener('beforeunload', saveAndReleaseLock);

            restoreLocalAnswerForCurrentQuestion();
        });

        const SESSION_CACHE_KEY = `session_cache:${sessionId}`;

        function getLocalSessionCache() {
            if (!SESSION_CACHE_KEY) return null;
            try {
                const raw = localStorage.getItem(SESSION_CACHE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (error) {
                console.warn('读取本地会话缓存失败:', error);
                return null;
            }
        }

        function saveLocalSessionCache(sessionData) {
            if (!SESSION_CACHE_KEY || interviewCompleted) return;
            try {
                const cache = {
                    sessionId: sessionId,
                    candidateId: candidateId,
                    currentRound: sessionData.currentRound || roundNumber,
                    maxRounds: sessionData.maxRounds || maxRounds,
                    currentQuestion: sessionData.currentQuestion || currentQuestion,
                    dialogueHistory: sessionData.dialogueHistory || [],
                    roundName: sessionData.roundName || '',
                    timestamp: new Date().toISOString()
                };
                localStorage.setItem(SESSION_CACHE_KEY, JSON.stringify(cache));
                console.log('[LocalCache] 会话已保存到本地缓存');
            } catch (error) {
                console.warn('保存本地会话缓存失败:', error);
            }
        }

        function clearLocalSessionCache() {
            if (SESSION_CACHE_KEY) {
                localStorage.removeItem(SESSION_CACHE_KEY);
            }
        }

        function getLocalProgress() {
            if (!localProgressKey) return null;

            try {
                const raw = localStorage.getItem(localProgressKey);
                return raw ? JSON.parse(raw) : null;
            } catch (error) {
                console.warn('读取本地面试进度失败:', error);
                return null;
            }
        }

        function saveLocalProgress() {
            if (!localProgressKey || interviewCompleted) return;

            const answerInput = document.getElementById('answerInput');
            const draft = answerInput ? answerInput.value : '';
            const progress = getLocalProgress() || { answers: {}, submitted: {} };
            const questionKey = currentQuestion || '__pending_question__';

            progress.sessionId = sessionId;
            progress.candidateId = candidateId;
            progress.configId = configId;
            progress.currentQuestion = currentQuestion;
            progress.roundNumber = roundNumber;
            progress.maxRounds = maxRounds;
            progress.updatedAt = new Date().toISOString();
            progress.answers = progress.answers || {};
            progress.submitted = progress.submitted || {};

            if (draft.trim()) {
                progress.answers[questionKey] = draft;
            } else {
                delete progress.answers[questionKey];
            }

            localStorage.setItem(localProgressKey, JSON.stringify(progress));
        }

        function restoreLocalAnswerForCurrentQuestion() {
            const progress = getLocalProgress();
            const answerInput = document.getElementById('answerInput');
            if (!progress || !answerInput || !currentQuestion) return;

            const localAnswer = (progress.answers || {})[currentQuestion];
            const hasServerSameQuestion = progress.currentQuestion === currentQuestion;

            if (localAnswer && !answerInput.value.trim()) {
                answerInput.value = localAnswer;
                showToast(hasServerSameQuestion ? '已从本地恢复未提交回答' : '已恢复本地草稿，请确认后提交', 'success');
            }
        }

        function restoreLocalSnapshotBeforeServer() {
            const progress = getLocalProgress();
            if (!progress || !progress.currentQuestion) return;

            currentQuestion = progress.currentQuestion;
            roundNumber = progress.roundNumber || roundNumber;
            maxRounds = progress.maxRounds || maxRounds;

            updateInterviewState();
            restoreLocalAnswerForCurrentQuestion();
        }

        function updateInterviewState(data = {}) {
            if (data.interview_type !== undefined) {
                currentInterviewType = data.interview_type || currentInterviewType;
                currentInterviewTypeLabel = data.interview_type_label || (isDiscussionInterview() ? '面谈' : '面试');
                applyInterviewTypeUi();
            }
            if (data.question !== undefined) {
                currentQuestion = data.question || currentQuestion || '';
            }
            if (data.round !== undefined) {
                roundNumber = data.round;
            } else if (data.round_number !== undefined) {
                roundNumber = data.round_number;
            } else if (typeof data.current_round === 'number') {
                roundNumber = data.current_round + 1;
            }
            if (data.total_rounds !== undefined) {
                maxRounds = data.total_rounds;
            } else if (data.max_rounds !== undefined) {
                maxRounds = data.max_rounds;
            }
            if (data.round_display_name !== undefined) {
                roundDisplayName = data.round_display_name || '';
            }
            if (data.round_objective !== undefined) {
                roundObjective = data.round_objective || '';
            }

            const roundInfo = document.getElementById('roundInfo');
            const questionNumber = document.getElementById('questionNumber');
            const questionText = document.getElementById('questionText');
            const roundLabel = maxRounds ? `第 ${roundNumber}/${maxRounds} 轮` : '';
            if (roundInfo) {
                if (isDiscussionInterview()) {
                    roundInfo.textContent = '面谈进行中';
                    roundInfo.title = '面谈由 AI 根据 HR 要求主导推进';
                } else {
                    roundInfo.textContent = roundDisplayName ? `${roundLabel} · ${roundDisplayName}` : roundLabel;
                    roundInfo.title = roundObjective || roundDisplayName || roundLabel;
                }
            }
            if (questionNumber) {
                questionNumber.textContent = isDiscussionInterview()
                    ? '问题'
                    : (roundDisplayName ? `问题 ${roundNumber} · ${roundDisplayName}` : `问题 ${roundNumber}`);
            }
            if (questionText) {
                questionText.textContent = currentQuestion || '正在获取问题...';
            }
        }

        function isDiscussionInterview() {
            return currentInterviewType === 'discussion';
        }

        function applyInterviewTypeUi() {
            const isDiscussion = isDiscussionInterview();
            const title = isDiscussion ? 'AI 智能面谈' : 'AI 智能面试';
            const actionLabel = isDiscussion ? '面谈' : '面试';
            const pageTitle = document.querySelector('.hero-copy h1');
            const pageLead = document.querySelector('.hero-copy p');
            const eyebrow = document.querySelector('.hero-copy .eyebrow');
            const headerNote = document.querySelector('.header-note');
            const statusText = document.querySelector('.status-indicator span');
            const transcriptPanel = document.getElementById('transcriptPanel');

            document.title = `未来世界 - AI ${actionLabel}进行中`;
            if (pageTitle) pageTitle.textContent = title;
            if (pageLead) pageLead.textContent = isDiscussion
                ? '问题将由 AI 根据 HR 要求自然推进，您可以语音作答或手动输入。'
                : '问题将自动播报，您可以语音作答或手动输入。';
            if (eyebrow) eyebrow.textContent = isDiscussion ? '请认真完成本次面谈' : '请认真完成每一道题';
            if (headerNote) headerNote.textContent = `${title}进行中`;
            if (statusText) statusText.textContent = `${actionLabel}进行中`;
            if (transcriptPanel && !hasMicStarted) {
                transcriptPanel.textContent = isDiscussion
                    ? '点击语音波浪接通面谈，接通后会自动播放问题并持续收音。'
                    : '点击语音波浪开启麦克风，听到问题后直接回答。';
            }
        }

        function updateSpokenQuestionText(text, isFinal = false) {
            let spoken = (text || '').trim();
            if (!spoken) return;
            
            // 清理轮次标记，避免在前端显示
            spoken = spoken.replace(/\s*<<ROUND\d+>>\s*$/g, '');
            
            const questionText = document.getElementById('questionText');
            if (!questionText) return;
            questionText.textContent = spoken;
            if (isFinal) {
                currentQuestion = spoken;
                saveLocalProgress();
            }
        }

        function markLocalAnswerSubmitted(question) {
            const progress = getLocalProgress();
            if (!progress) return;

            progress.answers = progress.answers || {};
            progress.submitted = progress.submitted || {};
            if (question) {
                delete progress.answers[question];
                progress.submitted[question] = true;
            }
            progress.updatedAt = new Date().toISOString();
            localStorage.setItem(localProgressKey, JSON.stringify(progress));
        }

        function clearLocalProgress() {
            if (localProgressKey) {
                localStorage.removeItem(localProgressKey);
            }
        }

        function restoreLocalAnswerForCurrentQuestion() {
            const progress = getLocalProgress();
            const answerInput = document.getElementById('answerInput');
            if (!progress || !answerInput || !currentQuestion) return;

            const localAnswer = (progress.answers || {})[currentQuestion];
            const hasServerSameQuestion = progress.currentQuestion === currentQuestion;

            if (localAnswer && !answerInput.value.trim()) {
                answerInput.value = localAnswer;
                showToast(hasServerSameQuestion ? '已从本地恢复未提交回答' : '已恢复本地草稿，请确认后提交', 'success');
            }
        }

        function clearLocalProgress() {
            if (localProgressKey) {
                localStorage.removeItem(localProgressKey);
            }
        }

        let inactivityTimer = null;
        const INACTIVITY_TIMEOUT = 180000; // 3分钟

        function resetInactivityTimer() {
            if (inactivityTimer) {
                clearTimeout(inactivityTimer);
            }
            if (!interviewCompleted && hasMicStarted) {
                inactivityTimer = setTimeout(() => {
                    saveAndReleaseLock(true);
                    showToast('面试已自动保存，3分钟无操作将关闭', 'success');
                }, INACTIVITY_TIMEOUT);
            }
        }

        function saveAndReleaseLock(shouldSave = false) {
            if (lockReleased && !shouldSave) {
                return;
            }

            lockReleased = true;

            if (shouldSave) {
                saveLocalSessionCache({
                    currentRound: roundNumber,
                    maxRounds: maxRounds,
                    currentQuestion: currentQuestion,
                    dialogueHistory: interviewDialogueHistory
                });

                if (realtimeSocket && realtimeSocket.readyState === WebSocket.OPEN) {
                    realtimeSocket.send(JSON.stringify({
                        type: 'save_state',
                        session_id: sessionId,
                        force_save: true,
                        dialogue_history: interviewDialogueHistory,
                        current_round: roundNumber
                    }));
                }
            }

            const payload = JSON.stringify({
                session_id: sessionId,
                config_id: configId
            });
            const blob = new Blob([payload], { type: 'application/json' });

            if (navigator.sendBeacon) {
                navigator.sendBeacon('/api/interview/release-lock/', blob);
            } else {
                fetch('/api/interview/release-lock/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: payload,
                    keepalive: true
                }).catch(() => {});
            }
        }

        function submitAnswer(autoSubmit = false) {
            clearAnswerCompletionTimer();
            const answerInput = document.getElementById('answerInput');
            const answer = (currentAnswerTranscript || answerInput.value || '').trim();
            const submittedQuestion = currentQuestion;

            if (!answer) {
                if (autoSubmit) return;
                showToast('请先输入或录制您的回答', 'error');
                return;
            }

            if (isAutoSubmitting || (submittedQuestion === lastSubmittedQuestion && answer === lastSubmittedAnswer)) {
                return;
            }

            if (isRecording && !autoSubmit) {
                stopContinuousRecording();
            }

            if (autoSubmit && realtimeSocket && realtimeSocket.readyState === WebSocket.OPEN) {
                interruptRealtimeResponse();
            }

            isAutoSubmitting = true;
            lastSubmittedQuestion = submittedQuestion;
            lastSubmittedAnswer = answer;

            const submitBtn = document.getElementById('submitAnswerBtn');
            submitBtn.disabled = true;
            document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator"></span>提交回答中...';
            submitBtn.innerHTML = '<span class="loading-spinner"></span>提交中...';

            // 通过WebSocket发送文本消息，由后端统一处理
            if (realtimeSocket && realtimeSocket.readyState === WebSocket.OPEN) {
                realtimeSocket.send(JSON.stringify({
                    type: 'text_message',
                    text: answer,
                    round_number: roundNumber
                }));
                
                // 等待WebSocket响应
                const responseTimeout = setTimeout(() => {
                    showToast('提交超时，请重试', 'warning');
                    isAutoSubmitting = false;
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '提交回答';
                }, 30000);
                
                // 存储回调以在收到响应时处理
                window._pendingAnswerCallback = {
                    submittedQuestion,
                    timeout: responseTimeout,
                    onSuccess: (data) => {
                        clearTimeout(responseTimeout);
                        window._pendingAnswerCallback = null;
                        
                        if (data.interview_complete) {
                            interviewCompleted = true;
                            clearLocalProgress();
                            stopContinuousRecording(false);
                            handleInterviewComplete();
                            return;
                        }
                        
                        showToast('回答已发送', 'success');
                        markLocalAnswerSubmitted(submittedQuestion);
                        
                        currentAnswerTranscript = '';
                        lastAssistantTranscript = '';
                        isCandidateSpeaking = false;
                        lastSubmittedQuestion = '';
                        lastSubmittedAnswer = '';

                        answerInput.value = '';
                        document.getElementById('transcriptPanel').textContent = '等待AI回复...';
                        setVoiceWave(false);
                        document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator"></span>等待AI回复';
                        saveLocalProgress();
                    },
                    onError: (error) => {
                        clearTimeout(responseTimeout);
                        window._pendingAnswerCallback = null;
                        showToast(error || '提交失败', 'error');
                        lastSubmittedQuestion = '';
                        lastSubmittedAnswer = '';
                    }
                };
            } else {
                showToast('实时连接未建立', 'error');
                isAutoSubmitting = false;
                submitBtn.disabled = false;
                submitBtn.innerHTML = '提交回答';
            }
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        function getRealtimeUrl() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            return `${protocol}//${window.location.host}/ws/voice-interview/`;
        }

        function ensureRealtimeConnected() {
            if (realtimeSocket && realtimeSocket.readyState === WebSocket.OPEN && realtimeReady) {
                return Promise.resolve();
            }

            if (realtimeConnectPromise) {
                return realtimeConnectPromise;
            }

            realtimeConnectPromise = new Promise((resolve, reject) => {
                realtimeSocket = new WebSocket(getRealtimeUrl());

                realtimeSocket.onopen = function() {
                    realtimeSocket.send(JSON.stringify({
                        type: 'start_interview',
                        session_id: sessionId,
                        candidate_id: candidateId,
                        question: currentQuestion,
                        round_number: roundNumber,
                        max_rounds: maxRounds
                    }));
                };

                realtimeSocket.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    if (data.type === 'error') {
                        if (isRealtimeClosedMessage(data.message || '')) {
                            handleRealtimeClosed(data.message);
                        } else {
                            showToast(data.message || '实时语音连接失败', 'error');
                        }
                        reject(new Error(data.message || 'Realtime error'));
                        return;
                    }

                    if (data.type === 'session_started') {
                        updateInterviewState(data);

                        if (data.current_question) {
                            currentQuestion = data.current_question;
                            updateInterviewState({ question: currentQuestion });
                            const questionText = document.getElementById('questionText');
                            if (questionText) {
                                questionText.textContent = currentQuestion;
                            }
                        }

                        if (data.round_number) {
                            roundNumber = data.round_number;
                        }

                        if (data.dialogue_history) {
                            interviewDialogueHistory = data.dialogue_history;
                        }

                        saveLocalSessionCache({
                            currentRound: roundNumber,
                            maxRounds: data.max_rounds || maxRounds,
                            currentQuestion: currentQuestion,
                            dialogueHistory: interviewDialogueHistory
                        });

                        if (!localCache) {
                            showToast('从云端恢复会话成功', 'success');
                        }

                        realtimeReady = true;
                        realtimeClosedNoticeShown = false;
                        startRealtimeKeepalive();
                        resetInactivityTimer();
                        document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator"></span>实时语音已连接';
                        resolve();
                        return;
                    }

                    if (data.type === 'response.started') {
                        isAssistantSpeaking = true;
                        realtimeAudioMuted = false;
                        isCandidateSpeaking = false;
                        setAudioButtons(true);
                        document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator active"></span>AI 正在回复...';
                        return;
                    }

                    if (data.type === 'round.state') {
                        // 如果面试已完成，直接处理结束逻辑
                        if (data.interview_complete) {
                            // 清除待处理的回答回调（避免重复处理）
                            if (window._pendingAnswerCallback) {
                                clearTimeout(window._pendingAnswerCallback.timeout);
                                window._pendingAnswerCallback = null;
                            }
                            handleInterviewComplete();
                            return;
                        }
                        
                        // 处理待处理的回答回调
                        if (window._pendingAnswerCallback) {
                            const callback = window._pendingAnswerCallback;
                            callback.onSuccess(data);
                        }
                        
                        updateInterviewState(data);
                        // 重置助手文本，准备新一轮
                        if (data.question) {
                            lastAssistantTranscript = data.question;
                            updateSpokenQuestionText(data.question, true);
                        }
                        return;
                    }

                    if (data.type === 'omni.text') {
                        updateSpokenQuestionText(data.text, true);
                        document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator"></span>请直接回答，系统会自动识别完成';
                        return;
                    }

                    if (data.type === 'omni.text_delta') {
                        // 显示AI的实时文本输出 - 直接累加，不再重复添加
                        lastAssistantTranscript += data.text || '';
                        updateSpokenQuestionText(lastAssistantTranscript, false);
                        document.getElementById('asrStatus').innerHTML = `<span class="recording-indicator active"></span>AI 正在说：${(data.text || '').slice(0, 18)}`;
                        return;
                    }

                    if (data.type === 'omni.user_transcript') {
                        handleRealtimeEvent({
                            type: 'conversation.item.input_audio_transcription.completed',
                            transcript: data.text
                        });
                        // 显示用户的语音转文字
                        updateAnswerTranscript({
                            type: 'conversation.item.input_audio_transcription.completed',
                            transcript: data.text
                        });
                        return;
                    }

                    if (data.type === 'omni.closed') {
                        handleRealtimeClosed(data.message || `Qwen3.5-Omni-Realtime 已断开${data.code ? `（${data.code}）` : ''}`);
                        if (!realtimeReady) {
                            reject(new Error(data.message || 'Qwen3.5-Omni-Realtime closed'));
                        }
                        return;
                    }

                    if (data.type === 'omni.event') {
                        handleRealtimeEvent(data.event || {});
                    }

                    if (data.type === 'omni.audio') {
                        handleRealtimeAudioDelta(data.audio);
                    }

                    if (data.type === 'omni.speech_started') {
                        handleRealtimeEvent({ type: 'omni.speech_started' });
                    }

                    if (data.type === 'omni.speech_stopped') {
                        handleRealtimeEvent({ type: 'omni.speech_stopped' });
                    }

                    if (data.type === 'omni.audio_committed') {
                        handleRealtimeEvent({ type: 'omni.audio_committed' });
                    }

                    if (data.type === 'interrupted' || data.type === 'omni.interrupted') {
                        realtimeAudioMuted = true;
                        resetAudioPlayback();
                        setAudioButtons(false);
                    }
                    
                    if (data.type === 'input_audio_buffer.cleared') {
                        realtimeAudioMuted = false;
                        if (hasMicStarted && isRealtimeRecognitionActive) {
                            document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator"></span>请直接回答，系统会自动识别完成';
                        } else if (!isRecording) {
                            document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator"></span>准备就绪';
                        }
                    }

                    if (data.type === 'question.continue') {
                        handleRealtimeEvent({ type: 'question.continue' });
                    }

                    if (data.type === 'round.completed') {
                        handleRealtimeEvent({ 
                            type: 'round.completed',
                            round_number: data.round_number,
                            max_rounds: data.max_rounds,
                            next_question: data.next_question
                        });
                    }

                    if (data.type === 'interview_complete') {
                        handleInterviewComplete();
                    }
                };

                realtimeSocket.onerror = function() {
                    realtimeReady = false;
                    realtimeConnectPromise = null;
                    reject(new Error('Realtime websocket error'));
                    handleRealtimeClosed('实时语音连接失败，请检查服务或密钥配置');
                };

                realtimeSocket.onclose = function() {
                    realtimeReady = false;
                    realtimeConnectPromise = null;
                    stopRealtimeKeepalive();
                    handleRealtimeClosed('Qwen3.5-Omni-Realtime 本地连接已关闭');
                    reject(new Error('Qwen3.5-Omni-Realtime websocket closed'));
                };
            });

            return realtimeConnectPromise;
        }

        function isRealtimeClosedMessage(message) {
            return /already closed|connection is closed|not ready|已断开|已关闭/i.test(message || '');
        }

        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 5;
        const RECONNECT_DELAY = 3000;

        function handleRealtimeClosed(message) {
            realtimeReady = false;
            realtimeConnectPromise = null;
            stopRealtimeKeepalive();
            
            if (!interviewCompleted && hasMicStarted && reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                reconnectAttempts++;
                const status = document.getElementById('asrStatus');
                if (status) {
                    status.innerHTML = `<span class="recording-indicator"></span>连接断开，正在尝试重连... (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`;
                }
                setTimeout(() => {
                    if (!interviewCompleted && hasMicStarted) {
                        ensureRealtimeConnected().then(() => {
                            reconnectAttempts = 0;
                            document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator active"></span>重连成功，继续收音中';
                        }).catch(() => {});
                    }
                }, RECONNECT_DELAY);
            }
            
            setAudioButtons(false);
            setVoiceWave(false);
            if (!hasMicStarted && isRecording) {
                stopContinuousRecording(false);
            }
            if (realtimeSocket && realtimeSocket.readyState === WebSocket.OPEN) {
                realtimeSocket.close();
            }
            if (interviewCompleted) {
                return;
            }
            if (!realtimeClosedNoticeShown) {
                realtimeClosedNoticeShown = true;
                showToast(message || 'Qwen3.5-Omni-Realtime 连接已断开', 'error');
            }
            const status = document.getElementById('asrStatus');
            if (status) {
                status.innerHTML = '<span class="recording-indicator"></span>Qwen3.5-Omni-Realtime 已断开，请刷新或重试';
            }
        }

        function handleInterviewComplete() {
            const actionLabel = isDiscussionInterview() ? '面谈' : '面试';
            const title = `${actionLabel}已完成`;
            const completionMsg = isDiscussionInterview()
                ? '感谢您参与本次 AI 面谈，祝您生活顺利'
                : '感谢您参与本次 AI 面试，祝您生活顺利';
            // 标记已完成，等待 AI 读完
            interviewCompleted = true;
            
            // 更新状态提示
            const status = document.getElementById('asrStatus');
            if (status) {
                status.innerHTML = `<span class="recording-indicator"></span>${actionLabel}结束，AI正在说完最后的话...`;
            }
            
            // 等待10秒，让AI读完最后的回复
            setTimeout(() => {
                // 清理状态
                clearLocalProgress();
                clearLocalSessionCache();
                stopContinuousRecording(false);
                
                if (realtimeSocket && realtimeSocket.readyState === WebSocket.OPEN) {
                    realtimeSocket.send(JSON.stringify({ type: 'finish_session' }));
                }
                
                document.body.innerHTML = `
                    <header class="site-header">
                        <div class="header-inner">
                            <div class="brand">
                                <img src="/api/ai-interview/hr/send-email/images/email-logo.jpg" alt="未来世界 Logo" onerror="this.style.display='none'">
                                <span>未来世界</span>
                            </div>
                            <div class="header-note">${title}</div>
                        </div>
                    </header>
                    <main class="completion-shell">
                        <div class="completion-card">
                            <div class="completion-mark">✓</div>
                            <h2>${title}</h2>
                            <p>${completionMsg}</p>
                            <button onclick="window.close()">关闭页面</button>
                        </div>
                    </main>
                `;
            }, 5000);
        }

        function startRealtimeKeepalive() {
            stopRealtimeKeepalive();
            realtimeKeepaliveTimer = setInterval(() => {
                if (realtimeSocket && realtimeSocket.readyState === WebSocket.OPEN) {
                    realtimeSocket.send(JSON.stringify({ type: 'ping' }));
                }
            }, 30000);
        }

        function stopRealtimeKeepalive() {
            if (realtimeKeepaliveTimer) {
                clearInterval(realtimeKeepaliveTimer);
                realtimeKeepaliveTimer = null;
            }
        }

        function handleRealtimeAudioDelta(audioDelta) {
            if (!audioDelta || isCandidateSpeaking) {
                return;
            }
            // 如果收到音频但还在静音，并且不是用户在说话，就自动取消静音
            if (realtimeAudioMuted) {
                realtimeAudioMuted = false;
                isAssistantSpeaking = true;
                setAudioButtons(true);
                console.log('[Audio Debug] Auto unmuting because audio received');
            }
            receivedRealtimeAudio = true;
            isAssistantSpeaking = true;
            if (questionSpeechFallbackTimer) {
                clearTimeout(questionSpeechFallbackTimer);
                questionSpeechFallbackTimer = null;
            }
            ensureAudioContext()
                .then(() => {
                    console.log('[Audio Debug] Playing audio chunk, length:', audioDelta.length, 'chars, sampleRate:', REALTIME_OUTPUT_SAMPLE_RATE, 'Hz');
                    console.log('[Audio Debug] AudioContext.sampleRate:', audioContext.sampleRate, 'Hz');
                    playPcm16Base64(audioDelta, REALTIME_OUTPUT_SAMPLE_RATE);
                    const status = document.getElementById('asrStatus');
                    if (status && !isRecording) {
                        status.innerHTML = '<span class="recording-indicator active"></span>AI 语音播放中';
                    }
                })
                .catch(error => {
                    console.warn('Realtime audio playback failed:', error);
                });
        }

        function handleRealtimeEvent(event) {
            const eventType = event.type || '';
            const audioDelta = getRealtimeAudioDelta(event, eventType);
            const transcriptText = getRealtimeTranscriptText(event);

            if (eventType === 'response.audio.done' || eventType === 'response.output_audio.done') {
                isAssistantSpeaking = false;
                setVoiceWave(false);
                setAudioButtons(false);
                if (hasMicStarted && isRealtimeRecognitionActive) {
                    document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator"></span>请直接回答，系统会自动识别完成';
                }
                return;
            }

            if (audioDelta) {
                handleRealtimeAudioDelta(audioDelta);
                return;
            }

            if (eventType === 'response.audio_transcript.done') {
                lastAssistantTranscript = transcriptText || lastAssistantTranscript;
                updateSpokenQuestionText(lastAssistantTranscript, true);
                if (hasMicStarted && isRealtimeRecognitionActive) {
                    document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator"></span>请直接回答，系统会自动识别完成';
                }
                return;
            }

            if (eventType === 'response.audio_transcript.delta') {
                lastAssistantTranscript += transcriptText || '';
                updateSpokenQuestionText(lastAssistantTranscript);
                document.getElementById('asrStatus').innerHTML = `<span class="recording-indicator active"></span>AI 正在回答：${(transcriptText || '').slice(0, 18)}`;
                return;
            }

            if (eventType.includes('input_audio_transcription') && transcriptText) {
                updateAnswerTranscript({
                    type: eventType,
                    transcript: transcriptText,
                    delta: event.delta
                });
                document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator active"></span>Transcript updated.';
                return;
            }

            if (
                eventType === 'input_audio_buffer.speech_stopped' ||
                eventType === 'input_audio_buffer.committed' ||
                eventType === 'omni.speech_stopped' ||
                eventType === 'omni.audio_committed'
            ) {
                isCandidateSpeaking = false;
                realtimeAudioMuted = false;
                setVoiceWave(false);
                scheduleAnswerCompletion();
                return;
            }

            if (eventType === 'input_audio_buffer.speech_started' || eventType === 'omni.speech_started') {
                handleCandidateSpeechStarted('server');
                return;
            }

            if (eventType === 'response.started' || eventType === 'conversation.item.created') {
                isAssistantSpeaking = true;
                realtimeAudioMuted = false;
                isCandidateSpeaking = false;
                setAudioButtons(true);
                document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator active"></span>AI 正在回复...';
                return;
            }
            
            if (eventType === 'response.done' || eventType === 'response.cancelled') {
                isAssistantSpeaking = false;
                setAudioButtons(false);
                realtimeAudioMuted = false;
                if (hasMicStarted && isRealtimeRecognitionActive) {
                    document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator"></span>请直接回答，系统会自动识别完成';
                } else if (!isRecording) {
                    document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator"></span>准备就绪';
                }
            }

            if (eventType === 'question.continue') {
                isAssistantSpeaking = true;
                document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator active"></span>继续播放问题...';
            }

            if (eventType === 'round.completed') {
                if (isDiscussionInterview()) {
                    currentQuestion = event.next_question || currentQuestion || '';
                    currentAnswerTranscript = '';
                    updateInterviewState({ question: currentQuestion });
                    document.getElementById('transcriptPanel').textContent = '点击语音波浪开始回答';
                    document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator"></span>准备就绪';
                    return;
                }
                roundNumber = (event.round_number || roundNumber) + 1;
                if (roundNumber > maxRounds) {
                    handleInterviewComplete();
                } else {
                    currentQuestion = event.next_question || '';
                    currentAnswerTranscript = '';
                    updateInterviewState({ question: currentQuestion, round: roundNumber, total_rounds: maxRounds });
                    document.getElementById('transcriptPanel').textContent = '点击语音波浪开始回答';
                    document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator"></span>准备就绪';
                    if (hasMicStarted && currentQuestion) {
                        playQuestionAudio(currentQuestion);
                    }
                }
            }
        }

        function getRealtimeAudioDelta(event, eventType) {
            const isAudioEvent = eventType.includes('audio.delta') || eventType.includes('output_audio.delta');
            return isAudioEvent ? (event.delta || event.audio || event.output_audio || event?.response?.audio?.delta || '') : '';
        }

        function getRealtimeTranscriptText(event) {
            const contentText = Array.isArray(event?.item?.content)
                ? event.item.content.map(item => item.transcript || item.text || '').join('')
                : '';
            return event.transcript || event.text || event.delta || event?.response?.transcript || contentText || '';
        }

        const PARTICLE_COUNT = 320;
        const CONTAINER_WIDTH = 340;
        const CONTAINER_HEIGHT = 340;
        const CENTER = { x: 170, y: 170 };
        const BASE_RADIUS = 65;
        const MAX_RADIUS = 145;
        let particles = [];
        let animationFrameId = null;
        let audioLevel = 0;
        let smoothedAudioLevel = 0;
        let targetRadius = BASE_RADIUS;
        let currentRadius = BASE_RADIUS;
        let heartbeatPhase = 0;
        let energyField = [];

        function initLogoParticles() {
            const logo = document.getElementById('logoPattern');
            if (!logo || logo.dataset.ready === 'true') return;
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < PARTICLE_COUNT; i++) {

                const radiusVariation = 0.7 + seededNoise(i, 17) * 0.6;
                const orbitSpeed = 0.002 + seededNoise(i, 23) * 0.004;
                const pulseSpeed = 1.2 + seededNoise(i, 29) * 0.8;
                const pulseAmplitude = 0.8 + seededNoise(i, 31) * 0.4;
                const escapeThreshold = 0.45 + seededNoise(i, 37) * 0.35;
                const escapeRecovery = 0.02 + seededNoise(i, 41) * 0.04;
                const orbitStep = orbitSpeed;
                const escapePhase = seededNoise(i, 53) * Math.PI * 2;
                const audioJitterPhase = seededNoise(i, 73) * Math.PI * 2;

                const colors = [
                    '#e8d4ff',
                    '#c9a8ff',
                    '#a87dff',
                    '#8b67ff',
                    '#ffc8dd',
                    '#ffb3c6',
                ];
                const colorIndex = Math.floor(seededNoise(i, 47) * colors.length);

                const model = {
                    el: particle,
                    baseAngle,
                    angle: baseAngle,
                    ca: Math.cos(baseAngle),
                    sa: Math.sin(baseAngle),
                    orbitStepCos: Math.cos(orbitStep),
                    orbitStepSin: Math.sin(orbitStep),
                    radiusVariation,
                    orbitSpeed,
                    pulseSpeed,
                    pulseAmplitude,
                    escapeThreshold,
                    escapeRecovery,
                    escapeOffsetX: 0,
                    escapeOffsetY: 0,
                    targetEscapeOffsetX: 0,
                    targetEscapeOffsetY: 0,
                    escapePhase,
                    escapeCa: Math.cos(escapePhase),
                    escapeSa: Math.sin(escapePhase),
                    audioJitterCa: Math.cos(audioJitterPhase),
                    audioJitterSa: Math.sin(audioJitterPhase),
                    individualPhase: escapePhase,
                    size: 1.5 + seededNoise(i, 59) * 1.8,
                    opacity: 0.65 + seededNoise(i, 61) * 0.35,
                    color: colors[colorIndex],
                    lifePulse: seededNoise(i, 67) * Math.PI * 2,
                    escapeDistanceScale: 35 * (0.8 + seededNoise(i + 100, 71) * 0.4),
                };

                particle.style.setProperty('--particle-size', `${model.size}px`);
                particle.style.setProperty('--particle-opacity', model.opacity);
                particle.style.setProperty('--particle-color', model.color);
                particle.style.setProperty('--glow-size', `${model.size * 2.5}px`);
                
                fragment.appendChild(particle);
                particles.push(model);
            }

            logo.appendChild(fragment);
            logo.dataset.ready = 'true';
            startParticleAnimation();
        }

        function startParticleAnimation() {
            let frameCount = 0;

            function animate() {
                frameCount++;
                updateVoiceWaveLevel();

                const audioFollowRate = audioLevel > smoothedAudioLevel ? 0.18 : 0.08;
                smoothedAudioLevel += (audioLevel - smoothedAudioLevel) * audioFollowRate;
                
                const energyIntensity = easeOutCubic(smoothedAudioLevel);
                heartbeatPhase += 0.04 + energyIntensity * 0.08;

                const audioHeartbeat = energyIntensity > 0.05 ? Math.pow(Math.max(0, Math.sin(heartbeatPhase)), 8) * (0.08 + energyIntensity * 0.3) : 0;
                const breathingMultiplier = 1 + audioHeartbeat;

                targetRadius = BASE_RADIUS + energyIntensity * (MAX_RADIUS - BASE_RADIUS);
                const radiusLerpRate = energyIntensity > 0.5 ? 0.15 : 0.06;
                currentRadius += (targetRadius - currentRadius) * radiusLerpRate;

                const swirlSpeed = 0.0015 + energyIntensity * 0.005;
                const globalSwirl = frameCount * swirlSpeed;
                const globalCa = Math.cos(globalSwirl);
                const globalSa = Math.sin(globalSwirl);
                const escapeSpin = frameCount * 0.02;
                const escapeSpinCa = Math.cos(escapeSpin);
                const escapeSpinSa = Math.sin(escapeSpin);
                const jitterSpin = frameCount * 0.05;
                const jitterSpinCa = Math.cos(jitterSpin);
                const jitterSpinSa = Math.sin(jitterSpin);

                for (let index = 0; index < particles.length; index += 1) {
                    const particle = particles[index];
                    
                    if (energyIntensity > 0.05) {
                        particle.lifePulse += 0.035 + energyIntensity * 0.08;
                    }
                    const lifePulseValue = energyIntensity > 0.05 ? Math.sin(particle.lifePulse) * particle.pulseAmplitude * (0.2 + energyIntensity * 0.3) : 0;

                    const nextCa = particle.ca * particle.orbitStepCos - particle.sa * particle.orbitStepSin;
                    const nextSa = particle.sa * particle.orbitStepCos + particle.ca * particle.orbitStepSin;
                    particle.ca = nextCa;
                    particle.sa = nextSa;
                    const localCa = nextCa * globalCa - nextSa * globalSa;
                    const localSa = nextSa * globalCa + nextCa * globalSa;

                    const baseDistance = currentRadius * particle.radiusVariation * breathingMultiplier;
                    
                    if (smoothedAudioLevel > particle.escapeThreshold) {
                        const escapeStrength = (smoothedAudioLevel - particle.escapeThreshold) / (1 - particle.escapeThreshold);
                        const escapeDistance = escapeStrength * particle.escapeDistanceScale;
                        const escapeCa = particle.escapeCa * escapeSpinCa - particle.escapeSa * escapeSpinSa;
                        const escapeSa = particle.escapeSa * escapeSpinCa + particle.escapeCa * escapeSpinSa;
                        particle.targetEscapeOffsetX = escapeCa * escapeDistance;
                        particle.targetEscapeOffsetY = escapeSa * escapeDistance;
                    } else {
                        particle.targetEscapeOffsetX = 0;
                        particle.targetEscapeOffsetY = 0;
                    }

                    particle.escapeOffsetX += (particle.targetEscapeOffsetX - particle.escapeOffsetX) * particle.escapeRecovery;
                    particle.escapeOffsetY += (particle.targetEscapeOffsetY - particle.escapeOffsetY) * particle.escapeRecovery;

                    const baseJitter = energyIntensity > 0.05 ? Math.sin(frameCount * 0.03 + particle.individualPhase) * 1.2 : 0;
                    const audioJitterIntensity = energyIntensity * 8;
                    const audioJitterX = (particle.audioJitterCa * jitterSpinCa - particle.audioJitterSa * jitterSpinSa) * audioJitterIntensity * particle.pulseAmplitude;
                    const audioJitterY = Math.sin(frameCount * 0.065 + particle.individualPhase) * audioJitterIntensity * particle.pulseAmplitude;

                    const audioPulseOffset = Math.sin(frameCount * particle.pulseSpeed + particle.individualPhase) * 2 * energyIntensity;
                    const distance = baseDistance + audioPulseOffset + lifePulseValue;

                    const finalX = CENTER.x + 
                        localCa * distance + 
                        particle.escapeOffsetX + 
                        baseJitter + audioJitterX;
                    const finalY = CENTER.y + 
                        localSa * distance + 
                        particle.escapeOffsetY + 
                        baseJitter + audioJitterY;

                    const baseGlow = 5;
                    const audioGlow = energyIntensity * 12;
                    const glowIntensity = baseGlow + audioGlow;
                    particle.el.style.setProperty('--glow-size', `${glowIntensity}px`);
                    
                    const baseOpacity = particle.opacity;
                    const audioOpacity = energyIntensity * 0.35;
                    const dynamicOpacity = Math.min(1, baseOpacity + audioOpacity);
                    particle.el.style.setProperty('--particle-opacity', dynamicOpacity);

                    particle.el.style.setProperty('--x', `${finalX.toFixed(2)}px`);
                    particle.el.style.setProperty('--y', `${finalY.toFixed(2)}px`);
                }

                audioLevel *= 0.88;
                animationFrameId = requestAnimationFrame(animate);
            }

            animate();
        }

        function lerp(start, end, amount) {
            return start + (end - start) * amount;
        }

        function easeOutCubic(value) {
            return 1 - Math.pow(1 - Math.min(1, Math.max(0, value)), 3);
        }

        function easeInOutCubic(value) {
            return value < 0.5 
                ? 4 * value * value * value 
                : 1 - Math.pow(-2 * value + 2, 3) / 2;
        }

        function setAudioLevel(level) {
            audioLevel = Math.min(1, Math.max(0, level));
        }

        function getAudioFeatures() {
            if (!micAnalyser || !micTimeData || !micFreqData) {
                return { level: audioLevel, centroid: 0, bass: 0, mid: 0, high: 0 };
            }

            micAnalyser.getByteTimeDomainData(micTimeData);
            micAnalyser.getByteFrequencyData(micFreqData);

            let sumSquares = 0;
            for (let i = 0; i < micTimeData.length; i += 1) {
                const v = (micTimeData[i] - 128) / 128;
                sumSquares += v * v;
            }
            const rms = Math.sqrt(sumSquares / micTimeData.length);

            let total = 0;
            let weighted = 0;
            let bass = 0;
            let mid = 0;
            let high = 0;

            for (let i = 0; i < micFreqData.length; i += 1) {
                const v = micFreqData[i] / 255;
                total += v;
                weighted += v * i;
                if (i < 6) bass += v;
                else if (i < 22) mid += v;
                else high += v;
            }

            bass /= 6;
            mid /= 16;
            high /= Math.max(1, micFreqData.length - 22);

            return {
                level: Math.min(1, rms * VISUALIZER_SENSITIVITY * 3.2),
                centroid: total > 0 ? weighted / total / micFreqData.length : 0,
                bass,
                mid,
                high
            };
        }

        function initVoiceWaveParticles() {
            initLogoParticles();
            
            const wave = document.getElementById('voiceWave');
            if (!wave || wave.dataset.ready === 'true') return;

            const fragment = document.createDocumentFragment();
            for (let i = 0; i < VOICE_WAVE_PARTICLE_COUNT; i += 1) {
                const particle = document.createElement('span');
                const x = seededNoise(i, 13);
                const wavePhase = x * Math.PI * 5.2 - Math.PI * 0.35;
                const waveY = Math.sin(wavePhase) * 22 + Math.sin(wavePhase * 0.47 + 1.2) * 12;
                const scatterY = (seededNoise(i, 29) - 0.5) * (28 + seededNoise(i, 47) * 34);
                const amp = 0.2 + seededNoise(i, 61) * 0.85;
                const drift = 0.25 + seededNoise(i, 83) * 0.75;
                const size = 1.4 + Math.pow(seededNoise(i, 101), 1.85) * 4.8;
                const hue = 18 + seededNoise(i, 127) * 22;
                const opacity = 0.34 + seededNoise(i, 149) * 0.54;
                particle.style.setProperty('--x', x.toFixed(4));
                particle.style.setProperty('--amp', amp.toFixed(3));
                particle.style.setProperty('--drift', drift.toFixed(3));
                particle.style.setProperty('--wave-y', waveY.toFixed(2));
                particle.style.setProperty('--scatter-y', scatterY.toFixed(2));
                particle.style.setProperty('--size', size.toFixed(2));
                particle.style.setProperty('--hue', hue.toFixed(1));
                particle.style.setProperty('--opacity', opacity.toFixed(2));
                particle.style.animationDelay = `${seededNoise(i, 173) * -1.1}s`;
                fragment.appendChild(particle);
            }
            wave.appendChild(fragment);
            wave.dataset.ready = 'true';
        }

        function seededNoise(index, salt) {
            const value = Math.sin((index + 1) * 12.9898 + salt * 78.233) * 43758.5453;
            return value - Math.floor(value);
        }

        function startCandidateSpeechWatch() {

                    }
                } else {
