        function updateVoiceWaveLevel(input) {
            let target = 0;
            if (micAnalyser) {
                target = getAudioFeatures().level;
            } else if (input && input.length) {
                let sum = 0;
                for (let i = 0; i < input.length; i += 1) {
                    sum += input[i] * input[i];
                }
                const rms = Math.sqrt(sum / input.length);
                target = Math.min(1, Math.max(0, rms * VISUALIZER_SENSITIVITY * 3.2));
            } else {
                return;
            }
            voiceWaveLevel += (target - voiceWaveLevel) * 0.38;

            setAudioLevel(voiceWaveLevel);

            if (!voiceWaveFrame) {
                voiceWaveFrame = requestAnimationFrame(() => {
                    voiceWaveFrame = null;
                    const wave = document.getElementById('voiceWave');
                    if (!wave) return;
                    wave.style.setProperty('--level', voiceWaveLevel.toFixed(3));
                    wave.classList.toggle('active', isRecording || voiceWaveLevel > 0.02);
                });
            }
        }

        function mergeTranscript(previous, nextText) {
            const next = (nextText || '').trim();
            if (!next) return previous || '';
            const current = (previous || '').trim();
            if (!current) return next;
            if (current.endsWith(next) || current.includes(next)) return current;
            return `${current} ${next}`;
        }

        function updateAnswerTranscript(event) {
            const answerInput = document.getElementById('answerInput');
            const transcriptPanel = document.getElementById('transcriptPanel');
            const eventType = event.type || '';
            const text = event.transcript || event.text || event.delta || '';
            const next = (text || '').trim();

            if (!next) return;

            if (event.delta && eventType.includes('delta')) {
                currentAnswerTranscript = `${currentAnswerTranscript || ''}${event.delta}`;
            } else if (!currentAnswerTranscript || next.length >= currentAnswerTranscript.trim().length) {
                currentAnswerTranscript = next;
            } else {
                currentAnswerTranscript = mergeTranscript(currentAnswerTranscript, next);
            }

            currentAnswerTranscript = currentAnswerTranscript.trim();
            answerInput.value = currentAnswerTranscript;
            transcriptPanel.textContent = currentAnswerTranscript || 'Recognizing your answer...';
            answerInput.scrollTop = answerInput.scrollHeight;

            if (!isCandidateSpeaking) {
                scheduleAnswerCompletion();
            }

        function detectRealtimeChatIntent(text) {
            const normalized = (text || '').replace(/[，。！？,.!?；;：:\s]/g, '').toLowerCase();
            if (!normalized) return 'empty';

            const plain = (text || '').replace(/[，。！？,.!?\s]/g, '').toLowerCase();
            if (/不会|不懂|不知道|不清楚|没做过|没有接触|答不上来|不会答/.test(plain)) return 'give_up';
            if (/等一下|稍等|想一下|让我想想|先等/.test(plain)) return 'wait';
            if (/再说一遍|重复一遍|没听清|没听见|再问一遍/.test(plain)) return 'repeat';
            if (/什么意思|不太懂|解释一下|这个问题是|能解释/.test(plain)) return 'clarify';

            const waitPhrases = ['等一下', '稍等', '等会', '等一会', '我想一下', '让我想想', '稍微等', '先等'];
            const repeatPhrases = ['再说一遍', '重复一下', '没听清', '没听见', '你再问一遍', '再问一遍'];
            const clarifyPhrases = ['什么意思', '没听懂', '不太懂', '哪里不懂', '解释一下', '这个问题是', '题目什么意思', '能解释'];
            const nonAnswerPhrases = [...waitPhrases, ...repeatPhrases, ...clarifyPhrases];

            if (nonAnswerPhrases.some(phrase => normalized.includes(phrase))) {
                if (waitPhrases.some(phrase => normalized.includes(phrase))) return 'wait';
                if (repeatPhrases.some(phrase => normalized.includes(phrase))) return 'repeat';
                return 'clarify';
            }

            return 'answer';
        }

        function sendRealtimeChatMessage(text) {
            if (!text || !realtimeSocket || realtimeSocket.readyState !== WebSocket.OPEN) return false;
            realtimeAudioMuted = false;
            resetAudioPlayback();
            realtimeSocket.send(JSON.stringify({
                type: 'text_message',
                text: text
            }));
            return true;
        }

        function clearCurrentTranscript(message = '我在听，准备好了可以继续说。') {
            currentAnswerTranscript = '';
            const answerInput = document.getElementById('answerInput');
            const transcriptPanel = document.getElementById('transcriptPanel');
            if (answerInput) answerInput.value = '';
            if (transcriptPanel) transcriptPanel.textContent = message;
            saveLocalProgress();
        }

        async function classifyAnswerIntent(text) {
            const normalized = (text || '').replace(/[，。！？,.!?；;：:\s]/g, '').toLowerCase();
            const plain = (text || '').replace(/[，。！？,.!?\s]/g, '').toLowerCase();
            
            if (!normalized) {
                return { intent: 'empty', shouldSubmit: false, shouldAdvance: false, reason: 'empty text' };
            }
            
            if (/不会|不懂|不知道|不清楚|没做过|没有接触|答不上来|不会答/.test(plain)) {
                return {
                    intent: 'give_up',
                    shouldSubmit: false,
                    shouldAdvance: true,
                    reason: '候选人明确表示不会'
                };
            }
            
            if (/等一下|稍等|想一下|让我想想|先等/.test(plain)) {
                return {
                    intent: 'wait',
                    shouldSubmit: false,
                    shouldAdvance: false,
                    reason: '等待性话语，继续对话'
                };
            }
            
            if (/再说一遍|重复一遍|没听清|没听见|再问一遍/.test(plain)) {
                return {
                    intent: 'repeat',
                    shouldSubmit: false,
                    shouldAdvance: false,
                    reason: '要求重复问题'
                };
            }
            
            if (/什么意思|不太懂|解释一下|这个问题是|能解释/.test(plain)) {
                return {
                    intent: 'clarify',
                    shouldSubmit: false,
                    shouldAdvance: false,
                    reason: '要求澄清问题'
                };
            }
            
            const textLength = (text || '').trim().length;
            if (textLength < 6) {
                return {
                    intent: 'chat',
                    shouldSubmit: false,
                    shouldAdvance: false,
                    reason: '内容过短，可能是插话'
                };
            }
            
            return {
                intent: 'answer',
                shouldSubmit: true,
                shouldAdvance: false,
                reason: 'VAD检测到停顿，内容足够长'
            };
        }

        function scheduleAnswerCompletion() {
            clearAnswerCompletionTimer();
            const answer = (currentAnswerTranscript || document.getElementById('answerInput').value || '').trim();
            if (!answer || isAutoSubmitting || interviewCompleted || isCandidateSpeaking) return;
            document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator"></span>检测到停顿，正在判断回答是否完成...';
            const answerSnapshot = answer;
            const questionSnapshot = currentQuestion;
            answerCompletionTimer = setTimeout(async () => {
                const finalAnswer = (currentAnswerTranscript || document.getElementById('answerInput').value || '').trim();
                if (
                    finalAnswer === answerSnapshot &&
                    currentQuestion === questionSnapshot &&
                    !isAutoSubmitting &&
                    !isCandidateSpeaking
                ) {
                    const intentResult = await classifyAnswerIntent(finalAnswer);
                    if (currentQuestion !== questionSnapshot || isAutoSubmitting || isCandidateSpeaking) return;

                    if (intentResult.shouldAdvance) {
                        currentAnswerTranscript = `候选人表示不会或不懂：${finalAnswer}`;
                        document.getElementById('answerInput').value = currentAnswerTranscript;
                        submitAnswer(true);
                        return;
                    }

                    if (!intentResult.shouldSubmit) {
                        if (sendRealtimeChatMessage(finalAnswer)) {
                            clearCurrentTranscript('继续说就可以，我会跟着你的节奏来。');
                            document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator"></span>已进入实时对话';
                        }
                        return;
                    }

                    submitAnswer(true);
                }
            }, ANSWER_COMPLETION_PAUSE_MS);
        }

        function setAudioButtons(isPlaying) {
            const playBtn = document.getElementById('playAudioBtn');
            const replayBtn = document.getElementById('replayAudioBtn');
            playBtn.disabled = isPlaying;
            replayBtn.disabled = isPlaying;
            playBtn.innerHTML = isPlaying ? '<span class="loading-spinner"></span>实时播放中...' : '播放问题';
            if (!isPlaying && realtimePlayFallbackTimer) {
                clearTimeout(realtimePlayFallbackTimer);
                realtimePlayFallbackTimer = null;
            }
        }

        async function playQuestionAudio(text) {
            if (!text) return;
            receivedRealtimeAudio = false;
            try {
                await ensureAudioContext();
                await ensureRealtimeConnected();
                realtimeAudioMuted = false;
                resetAudioPlayback();
                setAudioButtons(true);
                if (realtimePlayFallbackTimer) {
                    clearTimeout(realtimePlayFallbackTimer);
                }
                realtimePlayFallbackTimer = setTimeout(() => setAudioButtons(false), 600000);
                realtimeSocket.send(JSON.stringify({
                    type: 'speak_question',
                    question: text,
                    round_number: roundNumber,
                    max_rounds: maxRounds
                }));
            } catch (error) {
                console.error('Realtime question playback failed:', error);
                setAudioButtons(false);
                showToast('Qwen3.5-Omni-Realtime 语音连接失败，请检查服务或密钥配置', 'error');
            }
        }

        async function startContinuousRecording() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showToast('当前浏览器不支持麦克风录音，请使用 Chrome 或 Edge', 'error');
                return;
            }

            if (isRecording && micStream) return;

            try {
                await ensureAudioContext();
                await ensureRealtimeConnected();

                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: REALTIME_INPUT_SAMPLE_RATE,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        latency: { ideal: 0.003 }
                    },
                    video: false
                });

                micSource = audioContext.createMediaStreamSource(micStream);
                micAnalyser = audioContext.createAnalyser();
                micAnalyser.fftSize = VISUALIZER_FFT_SIZE;
                micAnalyser.smoothingTimeConstant = 0.18;
                micAnalyser.minDecibels = -88;
                micAnalyser.maxDecibels = -16;
                micTimeData = new Uint8Array(micAnalyser.fftSize);
                micFreqData = new Uint8Array(micAnalyser.frequencyBinCount);

                micSource.connect(micAnalyser);
                startRealtimeAudioPump(micStream);
                startCandidateSpeechWatch();

                isRecording = true;
                isRealtimeRecognitionActive = true;
                document.getElementById('transcriptPanel').textContent = currentAnswerTranscript || 'Listening...';
                document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator active"></span>实时收音中，可直接打断 AI';
                setVoiceWave(true);
                updateRecordingButton(true);
            } catch (error) {
                console.error('Start realtime recording failed:', error);
                showToast('启动 Qwen3.5-Omni-Realtime 语音失败，请检查麦克风权限、服务或密钥配置', 'error');
                stopContinuousRecording(false);
            }
        }

        function stopContinuousRecording(sendCommit = true) {
            isRecording = false;
            isRealtimeRecognitionActive = false;
            isCandidateSpeaking = false;
            voiceWaveLevel = 0;
            const wave = document.getElementById('voiceWave');
            if (wave) {
                wave.style.setProperty('--level', '0');
            }
            setVoiceWave(false);
            resetAudioPlayback();
            stopCandidateSpeechWatch();

            stopRealtimeAudioPump();
            if (micAnalyser) {
                micAnalyser.disconnect();
                micAnalyser = null;
            }
            micTimeData = null;
            micFreqData = null;
            micAudioFrameBuffer = null;
            if (micSource) {
                micSource.disconnect();
                micSource = null;
            }
            if (micStream) {
                micStream.getTracks().forEach(track => track.stop());
                micStream = null;
            }

            if (sendCommit && realtimeSocket && realtimeSocket.readyState === WebSocket.OPEN) {
                realtimeSocket.send(JSON.stringify({ type: 'end_recording' }));
            }

            document.getElementById('asrStatus').innerHTML = '<span class="recording-indicator"></span>录音已暂停';
            updateRecordingButton(false);
        }

        function updateRecordingButton(isRecordingNow) {
            const btnRow = document.getElementById('btnRow');

            if (isRecordingNow) {
                btnRow.innerHTML = '<button class="btn-stop-recording" id="stopRecordingBtn"><span class="recording-indicator active"></span> 暂停回答</button>';
                document.getElementById('stopRecordingBtn').addEventListener('click', function() {
                    stopContinuousRecording();
                });
            } else {
                btnRow.innerHTML = '<button class="btn-start-recording" id="startRecordingBtn">开始回答</button>';
                document.getElementById('startRecordingBtn').addEventListener('click', function() {
                    activateVoiceInterview();
                });
            }
        }

        async function toggleRecording() {
            if (isRecording) {
                // 停止录音并提交回答
                submitAnswer(false);
            } else {
                // 如果还没有初始化过麦克风，先初始化
                if (!hasMicStarted) {
                    document.getElementById('transcriptPanel').textContent = '正在开启麦克风...';
                    try {
                        await ensureAudioContext();
                    } catch (error) {
                        showToast('麦克风开启失败', 'error');
                        return;
                    }
                }
                await startContinuousRecording();
                // 第一次开始录音时，播放当前问题
                if (hasMicStarted && currentQuestion) {
                    await playQuestionAudio(currentQuestion);
                }
            }
        }

        async function startRealtimeAudioPump(stream) {
            const track = stream && stream.getAudioTracks ? stream.getAudioTracks()[0] : null;
            if (!track || typeof MediaStreamTrackProcessor === 'undefined') {
                console.warn('MediaStreamTrackProcessor is unavailable; realtime audio upload is disabled.');
                return;
            }

            try {
                const processor = new MediaStreamTrackProcessor({ track });
                micAudioReader = processor.readable.getReader();
                micAudioPumpActive = true;

                while (micAudioPumpActive && micAudioReader) {
                    const { value: audioData, done } = await micAudioReader.read();
                    if (done || !audioData) break;
                    try {
                        sendAudioDataFrame(audioData);
                    } finally {
                        audioData.close();
                    }
                }
            } catch (error) {
                if (micAudioPumpActive) {
                    console.warn('Realtime audio pump failed:', error);
                }
            }
        }

        function stopRealtimeAudioPump() {
            micAudioPumpActive = false;
            if (micAudioReader) {
                micAudioReader.cancel().catch(() => {});
                micAudioReader = null;
            }
        }

        function sendAudioDataFrame(audioData) {
            if (!isRecording || !realtimeReady || !realtimeSocket || realtimeSocket.readyState !== WebSocket.OPEN) return;

            const frameCount = audioData.numberOfFrames || 0;
            if (!frameCount) return;

            if (!micAudioFrameBuffer || micAudioFrameBuffer.length !== frameCount) {
                micAudioFrameBuffer = new Float32Array(frameCount);
            }
            try {
                audioData.copyTo(micAudioFrameBuffer, { planeIndex: 0, frameCount, format: 'f32' });
            } catch (error) {
                audioData.copyTo(micAudioFrameBuffer, { planeIndex: 0, frameCount });
            }

            const pcm = convertFloat32ToPcm16(micAudioFrameBuffer, audioData.sampleRate || audioContext.sampleRate, REALTIME_INPUT_SAMPLE_RATE);
            realtimeSocket.send(JSON.stringify({
                type: 'audio_chunk',
                audio: arrayBufferToBase64(pcm.buffer)
            }));
        }

        function createRealtimeAudioContext() {
            return new (window.AudioContext || window.webkitAudioContext)({
                sampleRate: REALTIME_OUTPUT_SAMPLE_RATE,
                latencyHint: 'interactive'
            });
        }

        function interruptRealtimeResponse() {
            const now = Date.now();
            realtimeAudioMuted = true;
            isAssistantSpeaking = false;
            resetAudioPlayback();
            setAudioButtons(false);
            if (realtimeSocket && realtimeSocket.readyState === WebSocket.OPEN) {
                if (now - lastInterruptSentAt < INTERRUPT_THROTTLE_MS) return;
                lastInterruptSentAt = now;
                realtimeSocket.send(JSON.stringify({ type: 'interrupt' }));
            }
        }

        function continueQuestionPlayback() {
            if (!currentQuestion || !realtimeReady) return;
            realtimeAudioMuted = false;
            setAudioButtons(true);
            if (realtimePlayFallbackTimer) {
                clearTimeout(realtimePlayFallbackTimer);
            }
            realtimePlayFallbackTimer = setTimeout(() => setAudioButtons(false), 600000);
            realtimeSocket.send(JSON.stringify({
                type: 'speak_question',
                question: currentQuestion,
                round_number: roundNumber,
                max_rounds: maxRounds,
                continue_mode: true
            }));
        }

        function initAudioContextSilently() {
            audioContext = createRealtimeAudioContext();
            const buffer = audioContext.createBuffer(1, 1, 22050);
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioContext.destination);
            source.onended = function() {
                try {
                    source.disconnect();
                } catch (e) {}
            };
            source.start(0);
        }

        function installAudioUnlockHandlers() {
            const unlock = () => {
                ensureAudioContext()
                    .then(() => {
                        audioUnlocked = true;
                    })
                    .catch(error => {
                        console.warn('Audio unlock failed:', error);
                    });
            };
            document.addEventListener('pointerdown', unlock, { once: true });
            document.addEventListener('keydown', unlock, { once: true });
        }

        function installFrontendErrorReporter() {
            window.addEventListener('error', event => {
                console.error('Frontend runtime error:', event.error || event.message);
                const status = document.getElementById('asrStatus');
                if (status) {
                    status.innerHTML = `<span class="recording-indicator"></span>页面脚本错误：${event.message || '未知错误'}`;
                }
            });
            window.addEventListener('unhandledrejection', event => {
                console.error('Frontend promise rejection:', event.reason);
                const status = document.getElementById('asrStatus');
                if (status) {
                    status.innerHTML = '<span class="recording-indicator"></span>语音播放 Promise 异常，请查看控制台';
                }
            });
        }

        async function ensureAudioContext() {
            if (!audioContext) {
                audioContext = createRealtimeAudioContext();
                console.log('[Audio Debug] AudioContext created with sampleRate:', audioContext.sampleRate);
                console.log('[Audio Debug] Expected output sampleRate:', REALTIME_OUTPUT_SAMPLE_RATE);
            }
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            audioUnlocked = audioContext.state === 'running';
        }

        function resetAudioPlayback() {
            audioQueue = [];
            isPlayingFromQueue = false;
            activeAudioSources.forEach(source => {
                try {
                    source.onended = null;
                    source.stop();
                    source.disconnect();
                } catch (error) {}
            });
            activeAudioSources.clear();
            realtimeOutputTime = audioContext ? audioContext.currentTime : 0;
        }

        function playPcm16Base64(base64Audio, sampleRate) {
            if (!audioContext || realtimeAudioMuted) return;
            
            const bytes = base64ToUint8Array(base64Audio);
            const pcm = new Int16Array(bytes.buffer, bytes.byteOffset, Math.floor(bytes.byteLength / 2));
            
            console.log('[Audio Debug] Received audio chunk: PCM samples:', pcm.length, 'Duration:', (pcm.length / sampleRate * 1000).toFixed(1), 'ms');

            schedulePcmChunk(pcm, sampleRate);
        }

        function schedulePcmChunk(pcm, sampleRate) {
            const audioBuffer = audioContext.createBuffer(1, pcm.length, sampleRate);
            const channel = audioBuffer.getChannelData(0);

            for (let i = 0; i < pcm.length; i++) {
                channel[i] = Math.max(-1, Math.min(1, pcm[i] / 32768));
            }

            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioContext.destination);

            const startTime = Math.max(
                audioContext.currentTime + REALTIME_AUDIO_SCHEDULE_LEAD_TIME,
                realtimeOutputTime || 0
            );
            realtimeOutputTime = startTime + audioBuffer.duration;

            activeAudioSources.add(source);
            source.onended = () => {
                activeAudioSources.delete(source);
                try {
                    source.disconnect();
                } catch (error) {}
            };

            source.start(startTime);

            console.log(
                '[Audio Debug] Scheduled chunk:',
                'duration:', audioBuffer.duration.toFixed(3), 's,',
                'delay:', (startTime - audioContext.currentTime).toFixed(3), 's,',
                'scheduledAhead:', Math.max(0, realtimeOutputTime - audioContext.currentTime).toFixed(3), 's'
            );
        }

        function convertFloat32ToPcm16(input, sourceSampleRate, targetSampleRate) {
            const samples = sourceSampleRate === targetSampleRate
                ? input
                : downsampleBuffer(input, sourceSampleRate, targetSampleRate);
            const output = new Int16Array(samples.length);
            for (let i = 0; i < samples.length; i += 1) {
                const s = Math.max(-1, Math.min(1, samples[i]));
                output[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
            }
            return output;
        }

        function downsampleBuffer(buffer, sourceSampleRate, targetSampleRate) {
            if (targetSampleRate >= sourceSampleRate) return buffer;
            const ratio = sourceSampleRate / targetSampleRate;
            const newLength = Math.round(buffer.length / ratio);
            const result = new Float32Array(newLength);
            let offsetResult = 0;
            let offsetBuffer = 0;

            while (offsetResult < result.length) {
                const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
                let accumulator = 0;
                let count = 0;
                for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i += 1) {
                    accumulator += buffer[i];
                    count += 1;
                }
                result[offsetResult] = accumulator / count;
                offsetResult += 1;
                offsetBuffer = nextOffsetBuffer;
            }

            return result;
        }

        function arrayBufferToBase64(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = '';
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }

        function base64ToUint8Array(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i += 1) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        }
