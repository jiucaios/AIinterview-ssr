<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI面试系统 - 候选人入口</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 450px;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            padding: 40px;
            text-align: center;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
        }
        
        .title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .job-info {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        
        .job-info h3 {
            color: #333;
            margin-bottom: 8px;
            font-size: 18px;
        }
        
        .job-info p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-group input::placeholder {
            color: #aaa;
        }
        
        .btn-start {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        .btn-start:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        
        .btn-start:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .footer p {
            color: #999;
            font-size: 13px;
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s;
        }
        
        .toast.success {
            background: #28a745;
        }
        
        .toast.error {
            background: #dc3545;
        }
        
        .error-message {
            color: #dc3545;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(0);
            }
        }
        
        .countdown {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 8px;
            color: #856404;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">🤖</div>
            <h1 class="title">AI面试系统</h1>
            <p class="subtitle">请验证身份后开始面试</p>
            
            <div class="job-info" id="jobInfo" style="display: none;">
                <h3 id="jobName">-</h3>
                <p id="jobDetails"></p>
            </div>
            
            <div id="errorMessage" class="error-message">
                <span id="errorText"></span>
            </div>
            
            <div id="candidateForm" style="display: none;">
                <div class="form-group">
                    <label for="candidateName">姓名 *</label>
                    <input type="text" id="candidateName" placeholder="请输入您的姓名" required>
                </div>
                
                <div class="form-group">
                    <label for="candidatePhone">手机号 *</label>
                    <input type="tel" id="candidatePhone" placeholder="请输入您的手机号" required pattern="1[3-9]\d{9}">
                </div>
                
                <button type="button" class="btn-start" id="verifyBtn">
                    验证身份
                </button>
            </div>
            
            <div id="actionArea" style="display: none;">
                <button type="button" class="btn-start" id="startBtn">
                    开始面试
                </button>
            </div>
            
            <div class="footer">
                <p>请确保在安静的环境中进行面试</p>
                <p style="margin-top: 5px;">面试过程将自动录音和记录</p>
            </div>
        </div>
    </div>
    
    <script>
        let configId = '';
        let sessionData = null;
        let candidateVerified = false;
        
        document.addEventListener('DOMContentLoaded', function() {
            // 从URL获取config_id
            const urlParams = new URLSearchParams(window.location.search);
            configId = urlParams.get('config_id');
            
            if (!configId) {
                showError('面试链接无效，请检查链接是否正确');
                return;
            }
            
            // 加载岗位信息
            loadJobInfo();
            
            // 验证身份按钮点击
            const verifyBtn = document.getElementById('verifyBtn');
            verifyBtn.addEventListener('click', async function() {
                await verifyCandidate();
            });
            
            // 开始面试按钮点击
            const startBtn = document.getElementById('startBtn');
            startBtn.addEventListener('click', async function() {
                await startInterview();
            });
        });
        
        async function loadJobInfo() {
            try {
                const response = await fetch(`/api/interview/job-info/?config_id=${configId}`);
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('jobName').textContent = data.job_name;
                    document.getElementById('jobDetails').textContent = `级别: ${data.job_level}`;
                    document.getElementById('jobInfo').style.display = 'block';
                    document.getElementById('candidateForm').style.display = 'block';
                } else {
                    showError(data.error || '无法获取岗位信息');
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
            }
        }
        
        async function verifyCandidate() {
            const name = document.getElementById('candidateName').value.trim();
            const phone = document.getElementById('candidatePhone').value.trim();
            
            if (!name) {
                showError('请输入姓名');
                return;
            }
            
            if (!phone || !/^1[3-9]\d{9}$/.test(phone)) {
                showError('请输入正确的手机号');
                return;
            }
            
            const btn = document.getElementById('verifyBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span>验证中...';
            
            try {
                const response = await fetch('/api/interview/verify-identity/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        config_id: configId,
                        name: name,
                        phone: phone
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    candidateVerified = true;
                    document.getElementById('candidateForm').style.display = 'none';
                    document.getElementById('actionArea').style.display = 'block';
                    showToast('身份验证成功', 'success');
                } else {
                    showError(data.error || '身份验证失败');
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '验证身份';
            }
        }
        
        async function startInterview() {
            if (!candidateVerified) {
                showError('请先验证身份');
                return;
            }
            
            const name = document.getElementById('candidateName').value.trim();
            const phone = document.getElementById('candidatePhone').value.trim();
            
            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span>正在进入面试...';
            
            try {
                const response = await fetch('/api/interview/verify-and-start/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        config_id: configId,
                        name: name,
                        phone: phone
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    sessionData = data;
                    showToast('即将进入面试...', 'success');
                    
                    setTimeout(() => {
                        redirectToInterview(data);
                    }, 1500);
                } else {
                    showError(data.error || '进入面试失败');
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '开始面试';
            }
        }
        
        function redirectToInterview(data) {
            // 使用后端返回的面试页面URL，或者构建URL
            if (data.interview_url) {
                window.location.href = data.interview_url;
            } else {
                const params = new URLSearchParams({
                    session_id: data.session_id,
                    candidate_id: data.candidate_id,
                    config_id: configId,
                    question: encodeURIComponent(data.question || '')
                });
                window.location.href = `/start-interview/?${params.toString()}`;
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            
            errorText.textContent = message;
            errorDiv.classList.add('show');
            
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }
        
        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>
</body>
</html>
